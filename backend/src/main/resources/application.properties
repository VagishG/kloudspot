spring.application.name=kloudspot-crud

# --- Datasource (Neon / Postgres) ---
# Provide via environment variables:
#   DB_URL      e.g. jdbc:postgresql://<host>/<db>?sslmode=require
#   DB_USERNAME e.g. neondb_owner
#   DB_PASSWORD e.g. <neon password>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# --- JWT ---
# Provide via environment variable JWT_SECRET (min 32 chars). Fallback is for local dev only.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdefghijklmnop}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
