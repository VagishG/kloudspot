spring.application.name=kloudspot-crud

# --- Server ---
server.port=${PORT:8080}

# --- Datasource (PostgreSQL) ---
# Supplied through environment variables. Docker Compose wires these to the
# bundled postgres service automatically, so no manual configuration is needed.
#   DB_URL      e.g. jdbc:postgresql://<host>:5432/<db>
#   DB_USERNAME
#   DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# --- JWT ---
# Set JWT_SECRET (min 32 chars) for stable sessions. When left unset a random
# secret is generated at startup, so no insecure default is ever shipped.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}

# --- CORS ---
# Comma separated list of allowed browser origins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
