# Production profile. Every value below is mandatory and must be supplied
# through environment variables. Activate with SPRING_PROFILES_ACTIVE=prod.

# --- Server ---
server.port=${PORT:8080}

# --- Datasource (mandatory) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# --- JWT (set JWT_SECRET for stable sessions; otherwise a random one is generated) ---
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (mandatory in production) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- OpenAPI / Swagger UI (disabled unless explicitly enabled) ---
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
